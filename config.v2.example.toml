# ledgerd (v2) configuration. Secrets NEVER live here — they come from the
# environment / systemd credentials only (see deploy/README.md and
# deploy/ledgerd.service). ledgerd.Load rejects the file outright if a
# secret's key (or any misspelled key) shows up below: BurntSushi/toml would
# otherwise decode this file and silently ignore an unrecognized key, which
# for a secret means "looks configured, does nothing".
#
# v2 shares no port, no database and no config file with the v1 `ledger`
# binary — this file is independent of config.example.toml.

[mail]
# domain: CHOSEN 2026-08-01 — sirdab.ae. Every inbound address v2 issues
# (e.g. "<local>@in.sirdab.ae") is derived from this value; there is no
# default and ledgerd refuses to start without it. Override with
# LEDGER_MAIL_DOMAIN. Closes spec §6's open question; plan task D1.
#
# DNS as configured (Cloudflare, re-verified 2026-08-01 after the operator
# set both api and mx1 to DNS-only):
#   in.sirdab.ae  MX 10 -> mx1.sirdab.ae -> 198.51.100.1   (direct, correct)
#   in.sirdab.ae  MX 20 -> mx2.sirdab.ae (DOES NOT RESOLVE — relay VPS deferred)
#   api.sirdab.ae            -> 198.51.100.1   (unproxied, required by D3's autocert)
#   app.sirdab.ae            -> 198.51.100.1   (the PWA + API origin; same certificate)
# api must stay unproxied: Cloudflare in front of it would break autocert's
# challenge and would collapse the per-IP sign-in limiter to one key, since
# every request would arrive from a Cloudflare address.
# The MX 20 entry is a dead end until the relay exists. Harmless while mx1 is
# up; the moment mx1 is down — exactly when a backup MX earns its keep —
# senders retry a non-resolving host instead of failing over. D3 provisions it
# or D1 removes the record.
domain             = "sirdab.ae"
smtp_listen        = ":25"        # SMTP receiver bind address (LEDGER_SMTP_LISTEN)
max_message_bytes  = 1000000      # DATA cap in bytes. NOT 1 MiB: spec §3.2 says 1 MB, but the binding limit is
                                  # blob.MaxColdMail (1,000,000) — a message is stored base64'd inside a JSON cold
                                  # record, so incompressible mail reaches gzip already inflated 4/3 and a message in
                                  # the top fraction of a percent of the 1 MiB range frames past the largest size
                                  # bucket. validate() refuses anything larger, because accepting mail over SMTP that
                                  # the ingest path then cannot store is the worst available failure.
per_address_daily  = 50           # max accepted deliveries per inbound address per day
invalid_rcpt_burst = 5            # invalid RCPTs from one IP before the tarpit engages
tarpit_base        = "2s"         # base delay applied per invalid RCPT once tarpitting

[server]
http_listen  = "127.0.0.1:8443"   # API + sync listener (LEDGER_HTTP_LISTEN). LOOPBACK unless tls_domains below is
                                  # set, and validate() refuses anything else: with no TLS domains ledgerd serves
                                  # PLAIN HTTP, and this listener carries a session bearer token on every request
                                  # plus the user's whole op log in the responses. The PUBLIC deployment sets this
                                  # to ":443" AND fills in tls_domains; neither alone is accepted.
tls_domains  = []                 # Host names autocert obtains Let's Encrypt certificates for, e.g.
                                  # ["app.sirdab.ae", "api.sirdab.ae"]. Bare host names — no scheme, no port, no
                                  # wildcard — because they are matched against the TLS server name. Non-empty is
                                  # the ONE thing that permits a non-loopback http_listen (Task D3): runServe then
                                  # terminates TLS in-process rather than serving cleartext. Challenges are
                                  # TLS-ALPN-01, on the same :443 socket, so port 80 need not be open at all.
                                  # Both names are on one certificate and serve the same origin-sharing PWA + API;
                                  # the WebAuthn rp_id is the parent domain so credentials work under either.
                                  # Not a secret.
autocert_cache = "/var/lib/ledger-v2/autocert"
                                  # Where autocert keeps issued certificates and its ACME account key (created
                                  # 0700). Required whenever tls_domains is set, and defaulted to this: a
                                  # deployment with nowhere to cache re-requests certificates on every restart and
                                  # walks into Let's Encrypt's issuance rate limit — a week-long outage caused by a
                                  # missing directory.
admin_listen = "127.0.0.1:8079"   # admin console bind address (LEDGER_ADMIN_LISTEN). TAILNET-ONLY, and enforced:
                                  # config.CheckAdminBind accepts ONLY a loopback address or one in Tailscale's
                                  # 100.64.0.0/10 (`tailscale ip -4`), and refuses everything else — ":8079",
                                  # "0.0.0.0:8079", a LAN address and a public one all fail at startup. It is
                                  # checked twice, in validate() and again in runServe immediately before
                                  # net.Listen. Unlike http_listen's rail this one is NOT lifted by Task D3 —
                                  # setting tls_domains does nothing for it, deliberately and permanently:
                                  # spec §3.1 keeps the console off the internet permanently, because it
                                  # publishes parsers and merchant mappings to every device in the beta and
                                  # reads diagnostics across all users. The binding is the control; the bearer
                                  # token below stops an accident inside the tailnet, not an attacker outside it.
dsn          = ""                 # Postgres DSN (LEDGER_PG_DSN) — required; never :8080, never /var/lib/ledger
# Secret, never stored here: LEDGER_ADMIN_TOKEN — static bearer token for the
# admin console, compared with subtle.ConstantTimeCompare. When it is UNSET the
# console is not served at all (ledgerd logs a warning and starts everything
# else); it is never served unauthenticated.

[relay]
enabled     = false               # whether this primary mounts the relay-facing API
primary_url = ""                  # in relay mode: the primary's base URL to forward to
spool_dir   = ""                  # in relay mode: durable local spool directory
# Secret, never stored here: LEDGER_RELAY_TOKEN — bearer token relay mode
# uses to authenticate delivery to the primary.

[push]
# enabled and expo_url are INERT since the Expo client's removal 2026-08-10.
# Nothing reads them: the Expo sender went with the native app. The struct
# fields stay because the loader rejects TOMLs with unknown keys, so deployed
# configs keep loading — and their validation stays too, so a wrong expo_url
# cannot sit in a file waiting for someone to flip a boolean.
#
# Setting enabled = true sends no notifications. It logs a line saying so at
# startup, and it still REQUIRES LEDGER_EXPO_ACCESS_TOKEN or the load refuses.
# Use web_enabled below.
enabled  = false                  # inert; was the Expo sender's switch
expo_url = ""                     # inert; was the Expo push endpoint
#
# Web Push (VAPID) for the PWA. This is the live push channel.
web_enabled   = false             # serve the VAPID key and send browser notifications
vapid_subject = ""                # REQUIRED when web_enabled: "mailto:you@example.com" or an https URL
# Secrets, never stored here: LEDGER_VAPID_PUBLIC and LEDGER_VAPID_PRIVATE.
# BOTH are required when web_enabled = true and the config load refuses
# otherwise. Mint the pair ONCE with `ledgerd vapid-keys` and never regenerate
# it: the public half is what every browser already subscribed under, so a new
# pair silently kills every existing subscription with nothing telling the user.
#
# The notification is content-free — the title is "New activity" and there is no
# body. That is not a placeholder: composing "AED 240 at Spinneys" server-side
# means decrypting user data here to build a string, which re-establishes the
# plaintext path the at-rest encryption exists to remove. See
# internal/v2/pushv2/webpush.go.

[auth]
apple_client_ids  = []            # Sign in with Apple client identifiers (not secret; LEDGER_APPLE_CLIENT_IDS, comma-separated)
google_client_ids = []            # Google Sign-In client identifiers (not secret; LEDGER_GOOGLE_CLIENT_IDS, comma-separated)
session_ttl       = "720h"        # 30 days; opaque server-side session lifetime

# Passkeys (WebAuthn). These are the PWA's sign-in surface and they replaced the
# two IdPs above: the App Store rule that forced Sign in with Apple went away
# with the native client. Not secrets — they are the site's own public identity,
# and that is exactly why they are configuration: they are what binds a ceremony
# to THIS deployment, and a passkey minted under one rp_id is unusable under
# another.
#
# rp_id is the bare effective domain: no scheme, no port. rp_origins are the
# fully qualified origins allowed to run a ceremony. Leaving rp_id empty means
# the six /api/v1/auth/passkey routes are NOT SERVED at all, rather than served
# and unable to verify anything.
rp_id             = ""                       # e.g. "ledger.example.com"  (LEDGER_RP_ID)
rp_display_name   = "Ledger by Sirdab"       # shown in the platform's passkey prompt (LEDGER_RP_DISPLAY_NAME)
rp_origins        = []                       # e.g. ["https://ledger.example.com"] (LEDGER_RP_ORIGINS, comma-separated)

# --- TEST-ONLY command-line switches. They have NO TOML KEY AT ALL. ---
#
# Neither of these can be set from this file or from the environment, and that
# is the point: "is this deployment accepting dev tokens" must be answerable
# from the command line that started the process and from nowhere else. Both are
# refused unless server.http_listen is a loopback address
# (config.EnableTestOnly), and `serve` prints a loud banner for each on every
# start.
#
#   ledgerd serve --dev-auth
#       Accepts "dev:<subject>" as an ID token and REJECTS every real Apple or
#       Google one — it replaces both verifiers rather than joining them, so a
#       deployment that left the flag on fails every genuine sign-in instead of
#       working perfectly while also accepting "dev:anyone". Anything reachable
#       with a session issued this way is reachable by anyone who can reach the
#       listener. Used by client/test/e2e and the Phase 1 exit test, which
#       cannot mint a real provider token offline.
#
#   ledgerd serve --dns-fixtures <path/to/dns.json>
#       Loads a recorded TXT map (arc.FixtureLookup) so DKIM/ARC verification is
#       deterministic and offline; a name that is not in the recording answers
#       "no key" and never falls through to a resolver. `serve` loads and
#       validates the file at startup, then wires it into ingest.NewResolver as
#       the TXT lookup the SMTP receiver (Task 24) and its DKIM/ARC
#       verification (Task 25) run every inbound message through — REPLACING
#       live DNS rather than joining it, so a deployment left pointed at a
#       stale recording verifies against frozen keys instead of falling
#       through to the real resolver.

# --- Consumed today: the merchant dictionary (Task 33). ---
#
# Secret, never stored anywhere in this file: LEDGER_DICT_HMAC_KEY — keys the
# merchant-dictionary submitter HMAC. Reading GET /api/v1/dictionary needs no
# key at all, so a deployment with this unset still distributes the
# operator's seeded rules; every WRITE (dict.ErrNoKey) and the moderation
# console refuse until it is set. It is a cryptographic key, not a setting,
# and has no TOML representation at all.
