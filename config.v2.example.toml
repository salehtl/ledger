# ledgerd (v2) configuration. Secrets NEVER live here — they come from the
# environment / systemd credentials only (see deploy/README.md and
# deploy/ledgerd.service). ledgerd.Load rejects the file outright if a
# secret's key (or any misspelled key) shows up below: BurntSushi/toml would
# otherwise decode this file and silently ignore an unrecognized key, which
# for a secret means "looks configured, does nothing".
#
# v2 shares no port, no database and no config file with the v1 `ledger`
# binary — this file is independent of config.example.toml.

[mail]
# domain: NOT YET CHOSEN — spec §6 / plan task D1. Every inbound address v2
# issues (e.g. "<local>@in.<domain>") is derived from this value, so it has
# no default and ledgerd refuses to start without it. Set it here or via
# LEDGER_MAIL_DOMAIN once the domain is picked.
domain             = ""
smtp_listen        = ":25"        # SMTP receiver bind address (LEDGER_SMTP_LISTEN)
max_message_bytes  = 1000000      # DATA cap in bytes. NOT 1 MiB: spec §3.2 says 1 MB, but the binding limit is
                                  # blob.MaxColdMail (1,000,000) — a message is stored base64'd inside a JSON cold
                                  # record, so incompressible mail reaches gzip already inflated 4/3 and a message in
                                  # the top fraction of a percent of the 1 MiB range frames past the largest size
                                  # bucket. validate() refuses anything larger, because accepting mail over SMTP that
                                  # the ingest path then cannot store is the worst available failure.
per_address_daily  = 50           # max accepted deliveries per inbound address per day
invalid_rcpt_burst = 5            # invalid RCPTs from one IP before the tarpit engages
tarpit_base        = "2s"         # base delay applied per invalid RCPT once tarpitting

[server]
http_listen  = "127.0.0.1:8443"   # API + sync listener (LEDGER_HTTP_LISTEN). LOOPBACK, and validate() refuses
                                  # anything else: ledgerd serves PLAIN HTTP today, and this listener carries a
                                  # session bearer token on every request plus the user's whole op log in the
                                  # responses. Task D4 is the change that lifts this — it adds autocert to runServe
                                  # so the process terminates TLS itself on the public domain, and that same change
                                  # moves this to ":443".
admin_listen = "127.0.0.1:8079"   # admin API bind address (LEDGER_ADMIN_LISTEN). Today validate() only refuses a
                                   # literal ":8080" suffix (v1's port); Task 32 adds the real restriction to
                                   # loopback/tailnet-only (100.64.0.0/10) addresses, so e.g. "0.0.0.0:8079" is
                                   # NOT rejected yet even though it will be once that task lands.
dsn          = ""                 # Postgres DSN (LEDGER_PG_DSN) — required; never :8080, never /var/lib/ledger
# Secret, never stored here: LEDGER_ADMIN_TOKEN — static bearer token for the
# admin API, compared with subtle.ConstantTimeCompare.

[relay]
enabled     = false               # whether this primary mounts the relay-facing API
primary_url = ""                  # in relay mode: the primary's base URL to forward to
spool_dir   = ""                  # in relay mode: durable local spool directory
# Secret, never stored here: LEDGER_RELAY_TOKEN — bearer token relay mode
# uses to authenticate delivery to the primary.

[push]
enabled  = false                  # Phase 1 default: no client exists yet, so push stays off
expo_url = ""                     # Expo push endpoint
# Secret, never stored here: LEDGER_EXPO_ACCESS_TOKEN — Expo's optional
# enhanced-security push token.

[auth]
apple_client_ids  = []            # Sign in with Apple client identifiers (not secret; LEDGER_APPLE_CLIENT_IDS, comma-separated)
google_client_ids = []            # Google Sign-In client identifiers (not secret; LEDGER_GOOGLE_CLIENT_IDS, comma-separated)
session_ttl       = "720h"        # 30 days; opaque server-side session lifetime

# --- TEST-ONLY command-line switches. They have NO TOML KEY AT ALL. ---
#
# Neither of these can be set from this file or from the environment, and that
# is the point: "is this deployment accepting dev tokens" must be answerable
# from the command line that started the process and from nowhere else. Both are
# refused unless server.http_listen is a loopback address
# (config.EnableTestOnly), and `serve` prints a loud banner for each on every
# start.
#
#   ledgerd serve --dev-auth
#       Accepts "dev:<subject>" as an ID token and REJECTS every real Apple or
#       Google one — it replaces both verifiers rather than joining them, so a
#       deployment that left the flag on fails every genuine sign-in instead of
#       working perfectly while also accepting "dev:anyone". Anything reachable
#       with a session issued this way is reachable by anyone who can reach the
#       listener. Used by client/test/e2e and the Phase 1 exit test, which
#       cannot mint a real provider token offline.
#
#   ledgerd serve --dns-fixtures <path/to/dns.json>
#       Loads a recorded TXT map (arc.FixtureLookup) so DKIM/ARC verification is
#       deterministic and offline; a name that is not in the recording answers
#       "no key" and never falls through to a resolver. Today `serve` LOADS and
#       VALIDATES the file and nothing consumes it: there is no SMTP receiver
#       (Task 24) and no DKIM/ARC verification (Task 25) in this process yet.
#       Those tasks take an arc.LookupTXT and this is where it comes from.

# --- Consumed by later Phase 1 tasks; inert today. ---
#
# Secret, never stored anywhere in this file: LEDGER_DICT_HMAC_KEY — keys the
# merchant-dictionary submitter HMAC (Task 33). It is a cryptographic key,
# not a setting, and has no TOML representation at all.
